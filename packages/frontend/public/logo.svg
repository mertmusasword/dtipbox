<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="naponiGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Background subtle glow circle -->
  <circle cx="50" cy="50" r="32" fill="#6366f1" opacity="0.2" filter="url(#glow)" />

  <!-- Stylized Geometric N Emblem -->
  <!-- Left Pillar -->
  <rect x="24" y="22" width="12" height="56" rx="6" fill="url(#naponiGrad)" filter="url(#glow)" />
  
  <!-- Diagonal Slash -->
  <path d="M29 25L71 75" stroke="url(#naponiGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Right Pillar -->
  <rect x="64" y="22" width="12" height="56" rx="6" fill="url(#naponiGrad)" filter="url(#glow)" />

  <!-- Center Fintech Tip Dot/Gem -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" filter="url(#glow)" />
</svg>
