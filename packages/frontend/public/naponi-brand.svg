<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="10" y1="10" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="textGrad" x1="75" y1="32" x2="260" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="bgBox" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Emblem -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="15" fill="url(#bgBox)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5" />
    <!-- Glowing N -->
    <rect x="14" y="13" width="7" height="30" rx="3.5" fill="url(#brandGrad)" filter="url(#brandGlow)" />
    <path d="M17 15L39 41" stroke="url(#brandGrad)" stroke-width="7" stroke-linecap="round" filter="url(#brandGlow)" />
    <rect x="35" y="13" width="7" height="30" rx="3.5" fill="url(#brandGrad)" filter="url(#brandGlow)" />
    <circle cx="28" cy="28" r="2.5" fill="#ffffff" filter="url(#brandGlow)" />
  </g>

  <!-- Brand Typography -->
  <text x="74" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="850" letter-spacing="-0.03em" fill="url(#textGrad)">NAPONI</text>
  <text x="75" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.12em" fill="#38bdf8">DIGITAL TIPPING</text>
</svg>
